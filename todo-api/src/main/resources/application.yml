# application.yml
# هدف الملف: ربط المشروع بقاعدة بيانات Oracle المحلية (بند: "store the data
# in an Oracle database - a local Oracle XE instance works perfectly")
# باستخدام المستخدم java_todo_task اللي أنشأناه بالفعل على Oracle.

spring:
  application:
    name: todo-api

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/orcl
    username: java_todo_task
    password: JavaUserPassword
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      # update: ينشئ/يعدّل الجداول تلقائيًا من الـ Entities (Category, Task)
      # بدون داتا موجودة تضيع - مناسب لمشروع بالحجم ده بدون أداة migrations منفصلة
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: 8080

# توثيق الـ API حسب بند: "Add Swagger so the API can be tried out right
# from the browser" - متاح على /swagger-ui.html بعد تشغيل المشروع
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
