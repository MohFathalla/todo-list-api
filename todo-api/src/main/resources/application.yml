# application.yml
# هدف الملف: ربط المشروع بقاعدة بيانات Oracle المحلية (بند: "store the data
# in an Oracle database - a local Oracle XE instance works perfectly")
# باستخدام المستخدم java_todo_task اللي أنشأناه بالفعل على Oracle.

spring:
  application:
    name: todo-api

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/orcl
    username: java_todo_task
    password: JavaUserPassword
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      # update: ينشئ/يعدّل الجداول تلقائيًا من الـ Entities (Category, Task)
      # بدون داتا موجودة تضيع - مناسب لمشروع بالحجم ده بدون أداة migrations منفصلة
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: 8080

# توثيق الـ API حسب بند: "Add Swagger so the API can be tried out right
# from the browser" - متاح على /swagger-ui.html بعد تشغيل المشروع
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# CR-002 (API Idempotency): how long an idempotency record stays valid.
# Not auto-purged yet — there's no scheduler in the project yet (that's
# CR-003); this property is just reserved for when a cleanup job is added.
app:
  idempotency:
    retention-hours: 24

# CR-005 (AI-Assisted Task Breakdown): a configurable, OpenAI-compatible
# chat-completions provider.
# IMPORTANT: never hard-code the real API key here. Set it through the
# AI_PROVIDER_API_KEY environment variable before starting the app, e.g.
#   Windows (PowerShell): $env:AI_PROVIDER_API_KEY = "sk-..."
#   Then run the app from that same terminal.
# base-url/model below default to DeepSeek's API as an example — point them
# at whichever OpenAI-compatible provider you actually have a key for.
ai:
  provider:
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ${AI_PROVIDER_API_KEY:sk-sssss}
